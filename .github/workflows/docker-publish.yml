name: Build and push images to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "frontend/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: consent-management
            context: services/consent-management
          - name: connector-config
            context: services/connector-config
          - name: registry-intelligence
            context: services/registry-intelligence
          - name: delivery-intelligence
            context: services/delivery-intelligence
          - name: openg2p-sync
            context: services/openg2p-sync
          - name: sunbird-adapter
            context: services/sunbird-adapter
          - name: digit-adapter
            context: services/digit-adapter
          - name: inji-adapter
            context: services/inji-adapter
          - name: api-gateway
            context: services/api-gateway
          - name: frontend
            context: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO || 'mysocial' }}:${{ matrix.name }}-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO || 'mysocial' }}:${{ matrix.name }}-latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
