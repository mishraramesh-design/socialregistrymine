# Override: use pre-built Docker Hub images instead of building from source.
# Requires DOCKERHUB_USERNAME and TAG env vars (DOCKERHUB_REPO optional, defaults
# to `mysocial`). See deploy/docker-hub.md.
#
#   DOCKERHUB_USERNAME=mishramesh TAG=v0.2.0 \
#     docker compose -f docker-compose.yml -f deploy/docker-compose.images.yml up -d

services:
  consent-management:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO:-mysocial}:consent-management-${TAG:-latest}
  connector-config:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO:-mysocial}:connector-config-${TAG:-latest}
  registry-intelligence:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO:-mysocial}:registry-intelligence-${TAG:-latest}
  delivery-intelligence:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO:-mysocial}:delivery-intelligence-${TAG:-latest}
  openg2p-sync:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO:-mysocial}:openg2p-sync-${TAG:-latest}
  sunbird-adapter:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO:-mysocial}:sunbird-adapter-${TAG:-latest}
  digit-adapter:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO:-mysocial}:digit-adapter-${TAG:-latest}
  inji-adapter:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO:-mysocial}:inji-adapter-${TAG:-latest}
  api-gateway:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO:-mysocial}:api-gateway-${TAG:-latest}
  frontend:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO:-mysocial}:frontend-${TAG:-latest}
