# Override file for mosip/inji-certify's docker-compose-injistack stack —
# verified directly against their docker-compose.yaml (Sept 2026), not guessed:
#
#   services: database, certify, certify-nginx, mimoto-service, inji-web
#   (verify-service ships commented out in their file — re-added below rather
#   than editing their tracked file)
#   network: external network named `mosip_network` (NOT auto-created —
#   this is a real prerequisite, same class of gotcha that broke the
#   Hostinger quick-deploy earlier: `docker network create mosip_network`
#   before bringing this stack up)
#
# Run alongside their compose file:
#   docker compose -f docker-compose.yaml -f /path/to/this/file up -d
# (from inside your inji-certify clone's docker-compose/docker-compose-injistack/ directory)

services:
  certify-nginx:
    networks:
      - network
      - social-registry-net

  # Re-added from mosip/inji-certify's own commented-out block (verbatim
  # image/env/ports) rather than editing their file. This gives you real
  # Inji Verify for the POC instead of leaving verification unavailable.
  verify-service:
    container_name: verify-service
    image: injistack/inji-verify-service:0.17.0
    user: root
    ports:
      - "8095:8080"
    environment:
      - active_profile_env=default
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_NAME=inji_verify
      - DATABASE_SCHEMA=verify
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - INJI_VP_REQUEST_LONG_POLLING_TIMEOUT=55000
      - INJI_VP_SUBMISSION_BASE_URL=http://verify-service:8080/v1/verify
      - INJI_DID_VERIFY_URI=did:web:verify-service:v1:verify
      - INJI_DID_VERIFY_PUBLIC_KEY_URI=did:web:verify-service:v1:verify#key-0
      - INJI_KEYSTORE_FILE_PASS=mosip
      - INJI_VERIFY_REDIRECT_URI=http://verify-service:8080
    depends_on:
      - database
    networks:
      - network
      - social-registry-net

networks:
  network:
    external: true
    name: mosip_network
  social-registry-net:
    external: true
