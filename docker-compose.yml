services:
  consent-management:
    build: ./services/consent-management
    ports: ["8001:8001"]
    env_file: .env
    volumes: ["consent-data:/app/data"]

  connector-config:
    build: ./services/connector-config
    ports: ["8002:8002"]
    env_file: .env
    volumes: ["connector-data:/app/data"]

  registry-intelligence:
    build: ./services/registry-intelligence
    ports: ["8003:8003"]
    env_file: .env
    volumes: ["registry-data:/app/data"]

  delivery-intelligence:
    build: ./services/delivery-intelligence
    ports: ["8004:8004"]
    env_file: .env
    volumes: ["delivery-data:/app/data"]

  openg2p-sync:
    build: ./services/openg2p-sync
    ports: ["8005:8005"]
    env_file: .env
    networks:
      - default
      - social-registry-net

  sunbird-adapter:
    build: ./services/sunbird-adapter
    ports: ["8006:8006"]
    env_file: .env
    networks:
      - default
      - social-registry-net

  digit-adapter:
    build: ./services/digit-adapter
    ports: ["8007:8007"]
    env_file: .env
    networks:
      - default
      - social-registry-net

  inji-adapter:
    build: ./services/inji-adapter
    ports: ["8008:8008"]
    env_file: .env
    networks:
      - default
      - social-registry-net

  api-gateway:
    build: ./services/api-gateway
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      - consent-management
      - connector-config
      - registry-intelligence
      - delivery-intelligence
      - openg2p-sync
      - sunbird-adapter
      - digit-adapter
      - inji-adapter

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - api-gateway

volumes:
  consent-data:
  connector-data:
  registry-data:
  delivery-data:

networks:
  # Shared with the separately-deployed Sunbird RC and OpenG2P stacks — see
  # deploy/README.md. Created once per host with `docker network create
  # social-registry-net` before bringing any of the three stacks up.
  social-registry-net:
    external: true
