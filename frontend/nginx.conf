# 127.0.0.11 is Docker's embedded DNS. Resolving api-gateway through a variable
# (rather than a bare `proxy_pass http://api-gateway:8000;`) forces nginx to look
# it up per-request via this resolver instead of once at startup — otherwise an
# api-gateway container that isn't up yet when nginx boots, or that restarts
# later with a new IP, breaks the proxy until nginx itself is restarted.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # No path after the variable, deliberately: with a variable in
        # proxy_pass, nginx does NOT auto-append the rest of the request URI
        # the way it does for a plain `proxy_pass http://host/path/;` — it
        # forwards only the literal text written here. Omitting a path
        # entirely is what makes nginx pass the original request URI
        # (/api/consent/health, etc.) through unmodified, which is exactly
        # what api-gateway's own /api/{service}/{path} routes expect.
        set $gateway_upstream http://api-gateway:8000;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing — any non-file, non-/api path falls back to index.html so
    # React Router's client-side routes (e.g. /doubt-registry) work on refresh.
    location / {
        try_files $uri /index.html;
    }
}
